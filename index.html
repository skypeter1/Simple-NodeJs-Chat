<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SocketApp</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true"></div>

    <header class="brand">
      <p class="brand__name">SocketApp</p>
      <p class="brand__tagline">Live room chat over websockets</p>
    </header>

    <main class="room" aria-label="Chat messages">
      <ul id="messages"></ul>
    </main>

    <form class="composer" action="" autocomplete="off">
      <label class="visually-hidden" for="m">Message</label>
      <input id="m" type="text" placeholder="Write a message…" maxlength="500" />
      <button type="submit">Send</button>
    </form>

    <script src="/socket.io/socket.io.js"></script>
    <script src="https://code.jquery.com/jquery-1.11.1.js"></script>
    <script>
      $(function () {
        var socket = io();
        var $messages = $('#messages');
        var $input = $('#m');

        function appendMessage(msg) {
          var $item = $('<li>').text(msg);
          $messages.append($item);
          $item[0].scrollIntoView({ behavior: 'smooth', block: 'end' });
        }

        $('.composer').submit(function () {
          var msg = $.trim($input.val());
          if (!msg) {
            return false;
          }
          socket.emit('chat message', msg);
          $input.val('');
          return false;
        });

        socket.on('chat message', function (msg) {
          appendMessage(msg);
        });
      });
    </script>
  </body>
</html>
